<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="玉を弾いてビットを立てるコリントゲーム。2進数・16進数と繰り上がりを物理で学ぶ。" />
    <title>ビットコリント | 2進数・16進数で遊ぶ</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="hud">
        <div class="hud__block">
          <span class="hud__label">スコア（値）</span>
          <span class="hud__value" id="value">0</span>
        </div>
        <div class="hud__block" style="text-align: center">
          <span class="hud__label">16進</span>
          <span class="hud__value" id="hex">0x00</span>
        </div>
        <div class="hud__block" style="text-align: right">
          <span class="hud__label">のこり玉</span>
          <span class="hud__value" id="balls">10</span>
        </div>
      </div>

      <div class="board-wrap" id="boardWrap">
        <canvas id="board"></canvas>
      </div>

      <div class="controls" style="padding: 0 4px 10px">
        <p class="prompt" style="margin: 0; text-align: left; flex: 1">
          押している間チャージ → 離して発射。左ほど高い桁。同じ桁に2回入ると桁上げ！
        </p>
        <button class="btn" id="musicBtn" type="button" style="white-space: nowrap">🔊 BGM</button>
      </div>
    </div>

    <div class="screenflash" id="screenflash"></div>
    <div class="bigmsg" id="bigmsg" aria-hidden="true"></div>

    <div class="overlay" id="overlay">
      <div class="overlay__big">🎯</div>
      <div class="overlay__title">ビットコリント</div>
      <div class="overlay__stat" id="overlayText">
        玉を10球弾いて、8ビットの値をできるだけ大きく！ 同じ桁に2回入ると桁上げ（繰り上がり）。
      </div>
      <button class="btn btn--primary" id="startBtn">スタート</button>
    </div>

    <script type="module" src="js/corinth.js"></script>
    <script type="module" src="js/pwa.js"></script>
  </body>
</html>
