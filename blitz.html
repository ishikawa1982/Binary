<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>ビットブリッツ</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="hud">
        <div class="hud__block">
          <span class="hud__label">SCORE</span>
          <span class="hud__value" id="score">0</span>
        </div>
        <div class="hud__block" style="text-align: center">
          <span class="hud__label">COMBO</span>
          <span class="combo" id="combo">×1</span>
        </div>
        <div class="hud__block" style="text-align: right">
          <span class="hud__label">LIFE</span>
          <span class="lives" id="lives">❤❤❤</span>
        </div>
      </div>

      <div class="timebar"><div class="timebar__fill" id="timefill"></div></div>

      <main
        style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(16px, 4vh, 30px)"
      >
        <div style="text-align: center">
          <span class="target__base" id="base">10進</span>
          <p class="prompt">この数を作れ</p>
          <div class="target" id="target">0</div>
        </div>
        <div id="bits"></div>
        <div class="current" id="current">いま <b>0</b></div>
      </main>

      <div class="controls">
        <label class="toggle">
          <input type="checkbox" id="weights" checked /><span>桁の重み</span>
        </label>
        <a class="link" href="index.html">← メニュー</a>
      </div>
    </div>

    <div class="screenflash" id="screenflash"></div>

    <div class="overlay" id="overlay">
      <div class="overlay__big">⚡</div>
      <div class="overlay__title">ビットブリッツ</div>
      <div class="overlay__stat" id="overlayText">お題の数を、時間内にビットで作ろう</div>
      <button class="btn btn--primary" id="startBtn">スタート</button>
    </div>

    <script type="module" src="js/blitz.js"></script>
    <script type="module" src="js/pwa.js"></script>
  </body>
</html>
