<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>ビットタワー</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="hud">
        <div class="hud__block">
          <span class="hud__label">SCORE</span>
          <span class="hud__value" id="score">0</span>
        </div>
        <div class="hud__block" style="text-align: center">
          <span class="hud__label">FLOOR</span>
          <span class="hud__value" id="floor">1</span>
        </div>
        <div class="hud__block" style="text-align: right">
          <span class="hud__label">LIFE</span>
          <span class="lives" id="lives">❤❤❤</span>
        </div>
      </div>

      <div class="timebar"><div class="timebar__fill" id="timefill"></div></div>

      <main class="tower">
        <div class="tower__total">
          <div class="hexview" id="hexview"><span class="hex__prefix">0x</span><span class="hex__last">0</span></div>
          <div class="decview" id="decview">= 0</div>
        </div>

        <div class="addrow">
          <span class="addchip" id="addchip">＋1</span>
        </div>
        <p class="prompt" id="hint">いまの桁 0 に 1 をたして作ろう</p>

        <div id="bits"></div>
        <div class="current" id="current">この桁 <b>0</b></div>
      </main>

      <div class="controls">
        <label class="toggle">
          <input type="checkbox" id="weights" checked /><span>桁の重み</span>
        </label>
        <a class="link" href="index.html">← メニュー</a>
      </div>
    </div>

    <div class="screenflash" id="screenflash"></div>
    <div class="bigmsg" id="bigmsg" aria-hidden="true"></div>

    <div class="overlay" id="overlay">
      <div class="overlay__big">🗼</div>
      <div class="overlay__title">ビットタワー</div>
      <div class="overlay__stat" id="overlayText">
        「＋N」をビットで足していこう。桁がFを超えると桁上がりでレベルアップ！
      </div>
      <button class="btn btn--primary" id="startBtn">スタート</button>
    </div>

    <script type="module" src="js/tower.js"></script>
    <script type="module" src="js/pwa.js"></script>
  </body>
</html>
