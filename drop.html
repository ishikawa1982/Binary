<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>ビットドロップ</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="hud">
        <div class="hud__block">
          <span class="hud__label">SCORE</span>
          <span class="hud__value" id="score">0</span>
        </div>
        <div class="hud__block" style="text-align: center">
          <span class="hud__label">COMBO</span>
          <span class="combo" id="combo">×1</span>
        </div>
        <div class="hud__block" style="text-align: right">
          <span class="hud__label">NEXT</span>
          <span class="next"><b id="next">–</b></span>
        </div>
      </div>

      <div class="field" id="field">
        <div class="danger-line" id="dangerline"><span>DANGER</span></div>
        <div class="block" id="block" hidden>0</div>
        <div class="stack" id="stack"></div>
      </div>

      <div class="current" id="current">合わせろ！ いま <b>0</b></div>
      <div id="bits"></div>

      <div class="controls">
        <label class="toggle">
          <input type="checkbox" id="weights" checked /><span>桁の重み</span>
        </label>
        <a class="link" href="index.html">← メニュー</a>
      </div>
    </div>

    <div class="screenflash" id="screenflash"></div>

    <div class="overlay" id="overlay">
      <div class="overlay__big">🧩</div>
      <div class="overlay__title">ビットドロップ</div>
      <div class="overlay__stat" id="overlayText">
        落ちる数字に、下のスイッチを合わせて消そう
      </div>
      <button class="btn btn--primary" id="startBtn">スタート</button>
    </div>

    <script type="module" src="js/drop.js"></script>
  </body>
</html>
